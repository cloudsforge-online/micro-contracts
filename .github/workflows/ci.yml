name: CI

# A library workspace, not a service: it serves no /livez, /readyz or /metrics, owns no database
# and ships no container, so micro-org/service-ci.yml — whose rules assert exactly those things —
# does not fit it, and forcing it through would mean weakening the rules for everyone else.
# This file is therefore the minimal bespoke check the estate allows a library: the workspace's
# own typecheck and test scripts, plus the shared secret hygiene.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A single checkout at the workspace root, so the action reads the packageManager field
      # (pnpm@11.9.0) itself — no version to drift here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # THIS JOB IS NAMED "Typecheck, test, build" AND HAD NO BUILD STEP, which is the same class of
      # defect as everything else the estate has been unpicking: a name asserting work that never
      # happened. micro-ui carried the identical one and closed it.
      #
      # It is not a formality here. Every package declares `prepack: pnpm build`, so
      # `tsconfig.build.json` runs for the first time at PUBLISH — a config no job had ever
      # executed, in the repository whose packages five services resolve through `link:`. It differs
      # from `pnpm typecheck` in the ways that break emit rather than checking: `noEmit: false`,
      # `outDir`, and a `rootDir` that fails the build outright if a source file is added outside
      # `src/`. A broken one surfaces as a failed release, which is the worst moment to find it.
      #
      # `dist/` is gitignored and nothing resolves to it — `exports` points at `./src/index.ts` —
      # so this step proves the artefact COMPILES and deliberately claims nothing more.
      - run: pnpm build

  # A contract change that breaks a consumer must fail HERE, in the repo that owns the contract,
  # not in the first consumer to upgrade. The checker itself lives in micro-org so that one
  # implementation judges every contract repository — this repository's own `pnpm compat` script
  # named a tools/compat.ts that has never existed here, so the check it claimed to run had never
  # run anywhere. `fetch-depth: 0` matters: the checker reads each package as it was at the base
  # ref, and a shallow clone silently has nothing to compare against.
  compat:
    uses: cloudsforge-online/micro-org/.github/workflows/contract-compat.yml@main
    secrets:
      # The checker lives in micro-org, which is private, so fetching it needs a contents:read
      # token — the job token is scoped to THIS repository and cannot see another one.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    with:
      require-dockerignore: false
    permissions:
      contents: read
